version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: atelier_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: atelier_ecommerce
    ports:
      - "5432:5432"
    volumes:
      - atelier_postgres_data:/var/lib/postgresql/data
    networks:
      - atelier_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atelier_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/atelier_ecommerce?schema=public
      PORT: 4000
      JWT_SECRET: dev_atelier_secret_2026
    depends_on:
      - postgres
    networks:
      - atelier_network

  frontend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: atelier_storefront
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    depends_on:
      - backend
    networks:
      - atelier_network

volumes:
  atelier_postgres_data:
    driver: local

networks:
  atelier_network:
    driver: bridge
